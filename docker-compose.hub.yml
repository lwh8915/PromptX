version: '3.8'

services:
  # 后端服务
  backend:
    image: lwh2460731039/promptx-backend:latest
    container_name: promptx-backend
    restart: unless-stopped
    environment:
      # MongoDB 配置（请创建 .env 文件配置或直接在此处填写）
      - MONGODB_URL=${MONGODB_URL}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-PromptX}

      # SMTP 配置（可选）
      - SMTP_HOST=${SMTP_HOST:-smtp.qq.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Prompt Manager}
      # LLM API 配置 (AI 提示词修改功能 - 多模型)
      # Zhipu (智谱)
      - ZHIPU_BASE_URL=${ZHIPU_BASE_URL:-https://demo.awa1.fun/v1/messages}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - ZHIPU_MODEL=${ZHIPU_MODEL:-ZhipuAI/GLM-4.7}
      # DeepSeek
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://ai.zzhdsgsss.xyz/v1/chat/completions}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-ai/DeepSeek-R1-0528-fast}
      # Gemini
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://gyapi.zxiaoruan.cn/v1/chat/completions}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-pro}
      # Claude
      - CLAUDE_BASE_URL=${CLAUDE_BASE_URL:-https://gyapi.zxiaoruan.cn/v1/chat/completions}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-5-20250929}
      # Watchtower 内网调用配置 (用于 /trigger-update 端点)
      - WATCHTOWER_URL=http://watchtower:8080/v1/update
      - WATCHTOWER_TOKEN=420420
    ports:
      - "8000:8000"
    networks:
      - promptx-network

  # 前端服务
  frontend:
    image: lwh2460731039/promptx-frontend:latest
    container_name: promptx-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - promptx-network

  # 自动更新服务
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true # 自动清理旧镜像
      - WATCHTOWER_HTTP_API_UPDATE=true # 开启 HTTP API
      - WATCHTOWER_HTTP_API_TOKEN=420420 # 与 WATCHTOWER_TOKEN 保持一致
    ports:
      - "3581:8080" # 外部端口3581 -> 容器端口8080
    networks:
      - promptx-network # 加入同一网络，使后端可以通过容器名访问
    command: --active-deadline-sec 30 # 容器更新超时时间

networks:
  promptx-network:
    driver: bridge
