version: '3.8'

services:
  # 后端服务
  backend:
    image: dockerhub_username/promptx-backend:latest
    container_name: promptx-backend
    restart: unless-stopped
    environment:
      # MongoDB 配置（请创建 .env 文件配置或直接在此处填写）
      - MONGODB_URL=${MONGODB_URL}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-PromptX}

      # SMTP 配置（可选）
      - SMTP_HOST=${SMTP_HOST:-smtp.qq.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Prompt Manager}
    ports:
      - "8000:8000"
    networks:
      - promptx-network

  # 前端服务
  frontend:
    image: dockerhub_username/promptx-frontend:latest
    container_name: promptx-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - promptx-network

  # 自动更新服务
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true # 自动清理旧镜像
      - WATCHTOWER_HTTP_API_UPDATE=true # 开启 HTTP API
      - WATCHTOWER_HTTP_API_TOKEN=自定义token # 根据用户要求设置
    ports:
      - "3581:8080" # 外部端口3581 -> 容器端口8080
    command: --active-deadline-sec 30 # 容器更新超时时间

networks:
  promptx-network:
    driver: bridge
